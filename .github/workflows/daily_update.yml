name: Daily Dashboard Update

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4  # 这里已经升级为 v4
        
      - name: Set up Python
        uses: actions/setup-python@v5  # 这里已经升级为 v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install requests openai markdown pytz
          
      - name: Run Agent Script
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python main.py
        
      - name: Commit and Push HTML
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update daily dashboard" && git push)
